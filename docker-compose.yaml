services:
  emqx:
    image: emqx/emqx-enterprise:6.2.2
    container_name: emqx
    ports:
      # Hanya listen di localhost — TLS di-terminate oleh Nginx di host.
      - "127.0.0.1:1883:1883"    # MQTT TCP     -> Nginx stream (mqtts 8883)
      - "127.0.0.1:8083:8083"    # MQTT WS      -> Nginx wss /mqtt
      - "127.0.0.1:18083:18083"  # Dashboard    -> Nginx https /
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: monicarovianadewi
volumes:
  emqx-data:
  emqx-log: