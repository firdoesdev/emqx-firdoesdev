# Blok STREAM (Layer 4) untuk MQTT TCP native dengan TLS termination.
#
# PENTING: blok `stream {}` TIDAK boleh di dalam `http {}`. Ia harus berada di
# level teratas /etc/nginx/nginx.conf. Cara paling rapi: tambahkan baris berikut
# di /etc/nginx/nginx.conf (di luar blok http{}), lalu simpan file ini di
# /etc/nginx/streams-enabled/stream-mqtt.conf :
#
#   stream {
#       include /etc/nginx/streams-enabled/*.conf;
#   }
#
# Kalau kamu tidak mau pakai include, cukup tempel seluruh isi `server {}` di
# bawah ini ke dalam blok stream{} milikmu.

server {
    # Client MQTT konek TLS ke mqtt.firdoes.dev:8883, Nginx terminate TLS
    # lalu teruskan plaintext ke EMQX di 127.0.0.1:1883.
    listen 8883 ssl;

    ssl_certificate     /etc/letsencrypt/live/mqtt.firdoes.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mqtt.firdoes.dev/privkey.pem;

    proxy_pass 127.0.0.1:1883;
    proxy_timeout 3600s;      # jaga koneksi MQTT yang idle (keepalive)
    proxy_connect_timeout 10s;
}
