# /etc/nginx/sites-available/mqtt.firdoes.dev.conf
# Blok HTTP: Dashboard EMQX + MQTT over WebSocket (WSS).
# Simpan di sites-available lalu symlink ke sites-enabled, atau taruh di conf.d/.

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mqtt.firdoes.dev;

    # Biarkan certbot webroot bekerja (opsional)
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mqtt.firdoes.dev;

    ssl_certificate     /etc/letsencrypt/live/mqtt.firdoes.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mqtt.firdoes.dev/privkey.pem;

    # --- MQTT over WebSocket (wss://mqtt.firdoes.dev/mqtt) ---
    # Listener WS default EMQX ada di port 8083 dengan path /mqtt.
    location /mqtt {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Koneksi MQTT bersifat long-lived — jangan cepat di-timeout.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Dashboard EMQX (https://mqtt.firdoes.dev/) ---
    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # KEAMANAN (opsional tapi disarankan): batasi akses dashboard ke IP kamu,
        # karena ini panel admin yang publik. Contoh:
        # allow 203.0.113.10;   # IP kantor/rumah
        # deny  all;
    }
}
